<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能隨機抽題測驗系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 24px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      color: #111827;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 16px;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 欄位設定 */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    select, input[type="number"], textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
      transition: all 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      height: 140px;
      font-family: inherit;
      resize: vertical;
    }

    /* 按鈕樣式 */
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:active { transform: scale(0.99); }
    
    .btn-secondary {
      background-color: #4b5563;
    }
    .btn-secondary:hover { background-color: #374151; }

    /* 測驗問題區塊 */
    .q-card {
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }
    .q-card:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .q-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      background-color: #e0e7ff;
      color: #3730a3;
    }

    .badge-diff {
      background-color: #f3e8ff;
      color: #6b21a8;
    }

    .q-title {
      font-size: 17px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 14px;
      white-space: pre-line;
    }

    /* 選項美化 */
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      background-color: #fff;
    }

    .option-item:hover {
      border-color: #a5b4fc;
      background-color: #f8fafc;
    }

    .option-item input[type="radio"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .option-text {
      font-size: 15px;
      color: #374151;
    }

    /* 隱藏/顯示控管 */
    .hidden { display: none !important; }

    /* 測驗結果頁面 */
    .score-banner {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .score-num {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      margin-top: 6px;
    }

    .explain-box {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .explain-correct {
      background-color: var(--success-bg);
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .explain-wrong {
      background-color: var(--danger-bg);
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .toggle-bank-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 互動式隨機測驗系統</h1>
  </div>

  <!-- 1. 設定與抽題區塊 -->
  <div class="card" id="setupCard">
    <div class="card-title">🎯 1. 選擇出題條件</div>
    
    <div class="grid-3">
      <div class="form-group">
        <label for="lessonSelect">課次／單元：</label>
        <select id="lessonSelect"></select>
      </div>
      <div class="form-group">
        <label for="diffSelect">難度：</label>
        <select id="diffSelect"></select>
      </div>
      <div class="form-group">
        <label for="questionCount">抽題數量：</label>
        <input type="number" id="questionCount" min="1" value="5">
      </div>
    </div>

    <button class="btn" onclick="startQuiz()">開始隨機測驗</button>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0 16px 0;">
    
    <button class="toggle-bank-btn" onclick="toggleBankInput()">✏️ 展開／修改文字題庫內容</button>
    <div id="bankArea" class="hidden">
      <div class="form-group">
        <label for="rawText">題庫原始文字：</label>
        <textarea id="rawText" oninput="autoParseBank()">七年級/國語/康軒/第三課　吃冰的滋味 中等
下列選項「　」中的字，何者讀音前後相同？
（Ａ）鑰「匙」／湯「匙」
（Ｂ）「便」利商店／大腹「便便」
（Ｃ）一「哄」而上／連「哄」帶騙
（Ｄ）晶瑩「剔」透／一再挑「剔」。
答案：（Ｄ）晶瑩「剔」透／一再挑「剔」。
詳解：（Ａ）˙ㄕ／ㄔˊ　（Ｂ）ㄅㄧㄢˋ／ㄆㄧㄢˊ　（Ｃ）ㄏㄨㄥ／ㄏㄨㄥˇ　（Ｄ）ㄊㄧ

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
「現代的冰品，拜科學昌明之賜，固然色彩繽紛，花樣百出，但單就口味而言，比起臺灣早年的冰製品，恐怕就遜色了。」根據本文，作者認為造成這種現象的原因是什麼？
（Ａ）早期社會以農業為主，科技落後；現代社會以工商業為主，科技發達
（Ｂ）早期社會採線性思考方式，少變化；現代社會打破僵化的思考方式，多變化
（Ｃ）早期社會講究信用，貨真價實；現代社會講究包裝，注重外表
（Ｄ）早期社會民風純樸，智識未開；現代社會資訊發達，有樣學樣。
答案：（Ｃ）早期社會講究信用，貨真價實；現代社會講究包裝，注重外表
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
（甲）從最早的芋冰，到國外進口的冰淇淋；從一枝五元的冰棒，到一客百元的火燒冰淇淋　（乙）尤其是嗜冰如命的小孩子們，更是得其所哉。一個夏天下來，吃掉的冰恐怕都要多過自己的體重　（丙）還有一種芋冰，它們裝成大桶，由小販騎著腳踏車沿街四處販賣兜售。小販手上還持有鈴鐺，一路騎來，串串鈴鐺聲響徹街頭巷尾　（丁）冰淇淋的味道雖好，但總難敵童年那分甜美的記憶啊。以上文句，哪些顯露出作者懷舊的情感？
（Ａ）甲丙
（Ｂ）丙丁
（Ｃ）乙丙
（Ｄ）乙丁。
答案：（Ｂ）丙丁
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 中等
「每到夏天吃冰時，我都會想起這些往事，像鄉愁般的隨著現代化的冰淇淋一一嚥下。」這段話的含義為何？
（Ａ）作者思念家鄉時就會吃冰
（Ｂ）冰品可算是作者的第二家鄉
（Ｃ）吃冰的往事如同鄉愁一般難忘
（Ｄ）吃冰是家鄉唯一令人懷念的往事。
答案：（Ｃ）吃冰的往事如同鄉愁一般難忘
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
下列文句的含義，何者前後可互相呼應？
（Ａ）人的一生中，最適合吃冰的年紀，是小學到初中這個階段／現代人誠然口福不淺
（Ｂ）早期的社會單純，小生意人講的是信用，貨真價實，童叟無欺／臺糖產製的冰棒和冰水，使用的都是道地的砂糖，絕不含糖精
（Ｃ）近人講究包裝，較重外表／那冰屑就像雪花一般，一片一片飛落盤中
（Ｄ）除了冰棒和冰水之外，刨冰也是相當普遍的冰品／小販騎著腳踏車沿街四處販賣兜售。小販手上還持有鈴鐺，一路騎來，串串鈴鐺聲響徹街頭巷尾。
答案：（Ｂ）早期的社會單純，小生意人講的是信用，貨真價實，童叟無欺／臺糖產製的冰棒和冰水，使用的都是道地的砂糖，絕不含糖精
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 中等
「早期的社會單純，小生意人講的是信用，貨真價實，童叟無欺。近人講究包裝，較重外表，內容則能省則省。」這段話以昔日的狀態對照現今的情形，除了表現對往日的懷念外，也流露出社會變遷的今昔之感。下列何者也具有「今昔對比」的感覺？
（Ａ）宮女如花滿春殿，只今惟有鷓鴣飛
（Ｂ）醉臥沙場君莫笑，古來征戰幾人回
（Ｃ）無邊落木蕭蕭下，不盡長江滾滾來
（Ｄ）日暮鄉關何處是？煙波江上使人愁。
答案：（Ａ）宮女如花滿春殿，只今惟有鷓鴣飛
詳解：【語譯】（Ａ）當年如花的宮女站滿了宮殿，可惜如今卻只有幾隻鷓鴣在王城故址上飛了。　（Ｂ）若我醉倒在戰場上，請君莫笑我，從古至今外出征戰又有幾人能回家？　（Ｃ）無數落葉隨風飄墜，發出了蕭蕭聲響。望不到盡頭的長江水，滾滾奔流而來。　（Ｄ）天色已晚，眺望遠方，故鄉在哪兒呢？眼前只見一片雲煙瀰漫的水面，給人帶來深深的愁緒。

---

七年級/國語/康軒/第三課　吃冰的滋味 進階
「近人講究包裝，較重外表，內容則能省則省。」這句話可用下列何者為注腳？
（Ａ）虛有其表
（Ｂ）表裡如一
（Ｃ）不看僧面看佛面
（Ｄ）好女不穿嫁時衣。
答案：（Ａ）虛有其表
詳解：（Ａ）形容空有華麗的外表，卻無實際的內涵　（Ｂ）內外一致。指思想和言行一致　（Ｃ）不看本人的情面，也看第三者的情面。指總要給點面子　（Ｄ）比喻人有志氣，不靠父母餘蔭度日

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
「所謂的暑假，也幾乎是冰棒、冰水或刨冰的代名詞。」關於這句話，下列何者說明正確？
（Ａ）冰品使暑假變得多采多姿，令人回味無窮
（Ｂ）暑假是適合幫冰棒、冰水或刨冰代言的季節
（Ｃ）暑假結束，市面上的冰棒、冰水就漸漸少見了
（Ｄ）放暑假時，孩童除了吃冰，什麼事情也不做。
答案：（Ａ）冰品使暑假變得多采多姿，令人回味無窮
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 中等
下列與「冰」相關的歇後語，何者說明錯誤？
（Ａ）冰糖煮黃連—同甘共苦
（Ｂ）冰山上畫畫—冰清玉潔
（Ｃ）冰塊掉進醋缸裡—寒酸
（Ｄ）冰天雪地發牢騷—冷言冷語。
答案：（Ｂ）冰山上畫畫—冰清玉潔
詳解：（Ｂ）冰山上畫畫—好景不長

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
「夏日吃冰，是人生的一大享受。」這句話在全文中具有什麼作用？
（Ａ）提示冰品只有在夏日品嘗，才是享受
（Ｂ）以誇張的筆法引起讀者好奇，進而想一探究竟
（Ｃ）點出人生的許多享受中，夏日吃冰是最難得的
（Ｄ）點出主題，總述自己對夏日吃冰的甜美記憶。
答案：（Ｄ）點出主題，總述自己對夏日吃冰的甜美記憶。
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 中等
外來語的使用在日常生活中極為普遍，例如：冰淇淋。下列選項，何者皆為外來語？
（Ａ）巴士／速配
（Ｂ）血拼／鬥陣
（Ｃ）粉絲／巧克力
（Ｄ）幽默／強強滾。
答案：（Ｃ）粉絲／巧克力
詳解：（Ａ）英語ｂｕｓ的音譯／臺語　（Ｂ）英語ｓｈｏｐｐｉｎｇ的音譯／臺語　（Ｃ）英語ｆａｎｓ的音譯／英語ｃｈｏｃｏｌａｔｅ的音譯（Ｄ）英語ｈｕｍｏｕｒ的音譯／臺語

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
「單就口味而言」句中的「單」字意思是「僅、只」，下列何者與之相同？
（Ａ）「單」槍匹馬
（Ｂ）「單」打獨鬥
（Ｃ）「單」說不做
（Ｄ）形「單」影隻。
答案：（Ｃ）「單」說不做
詳解：（Ａ）（Ｄ）單獨、一個　（Ｂ）孤獨的、獨自一人的

---

七年級/國語/康軒/第三課　吃冰的滋味 基礎
〈吃冰的滋味〉：「一旦把冰抽離，相信每個人的童年都會黯然失色。」這句話的含義與下列何者最相近？
（Ａ）冰品添加物的色彩鮮豔，奪人眼目，成為大家最難忘的童年記憶
（Ｂ）現代冰品不斷推陳出新，為孩子創造更加愉快美好的童年
（Ｃ）吃冰是童年的唯一樂事，而作者的孩子更是嗜冰如命
（Ｄ）冰品豐富了許多人的童年，具有無可取代的地位。
答案：（Ｄ）冰品豐富了許多人的童年，具有無可取代的地位。
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 進階
古蒙仁：「一個較聰明的作家，在決定他選取的題材時，一定會找他熟悉的、有感情的對象去寫。」據此研判，他選擇「吃冰的滋味」這個題材的原因為何？
（Ａ）小時候住在臺糖宿舍裡
（Ｂ）對冰品價格的變動瞭若指掌
（Ｃ）對「射芋冰」遊戲念念不忘
（Ｄ）味覺敏銳，尤其是對於冰品。
答案：（Ａ）小時候住在臺糖宿舍裡
詳解：(無)

---

七年級/國語/康軒/第三課　吃冰的滋味 中等
（甲）每到夏天，糖廠福利社前總是大排長龍，爭購各類冰品，晚到一步的可能就要向隅　（乙）刨冰的種類繁多，主要有四果冰、粉圓冰、仙草冰、愛玉冰、米苔目，或由其中二至三種混在一起　（丙）這些刨冰的添加物，像四果、粉圓、仙草、愛玉，或色彩鮮豔、或澄澈剔透、或方塊結晶，看起來都足以奪人眼目　（丁）串串鈴鐺聲響徹街頭巷尾，人人便知是賣芋冰的小販來了，便一哄而上，團團將小販圍住。以上文句，哪些可反映冰品廣受喜愛？
（Ａ）甲丙
（Ｂ）乙丙
（Ｃ）丙丁
（Ｄ）甲丁。
答案：（Ｄ）甲丁。
詳解：（乙）描寫刨冰的種類繁多　（丙）描寫刨冰添加物的種類及視覺感受

---

七年級/國語/康軒/第三課　吃冰的滋味 中等
下列文句「　」中與冰相關的成語，何者運用最恰當？
（Ａ）他的處境已如「冰消瓦解」一般，很難化險為夷
（Ｂ）經過老師出面排解後，一場糾紛就此「如履薄冰」了
（Ｃ）面對事情要戒慎恐懼、「虎尾春冰」，不可有絲毫大意
（Ｄ）所謂「夏蟲不可語冰」，對於見識短淺的人，就不要和他談大道理了。

「工業革命之後，人類第一個被糟蹋的大概就是吃。想想看，所有上班族對『吃』都很難做到所謂的講究，因為時間太匆忙了，人們好像匆忙到連自己最切身有關的『吃』這件行為都草率了事，只是把自己『餵飽』。我覺得『餵飽』是一個滿讓人傷心的人類行為，因為我們有時對動物都不認為牠們只是被『餵飽』。相信養過寵物的朋友都知道，牠們的食物現在都可以因為主人的關照而十分講究，何況是人？」（蔣勳 生活的美學旨在抵抗一個字）根據這段文字，作者覺得「『餵飽』是一個滿讓人傷心的人類行為」的原因最可能是下列何者？
（Ａ）把人貶低到動物層次的需求
（Ｂ）物質生活不如以往寬裕
（Ｃ）人對吃的講究還不如寵物

答案：（Ｃ）人對吃的講究還不如寵物
詳解：（Ａ）由「我們有時對動物都不認為牠們只是被『餵飽』」、「牠們的食物現在都可以因為主人的關照而十分講究」可知此選項不符文意

古蒙仁：「在我接觸了愈多，看了愈廣之後，當然不可能再回過頭去寫學校的那一套，而必須突破這層藩籬，去開拓新的創作世界了。在題材上如此，而帶著批判精神的寫實風格也是如此，我覺得寫實的路線，更可以表明我的態度和立場，我認為這種轉變是自然而正確的。」關於這段話，下列何者說明正確？
（Ａ）作者創作風格由寫實轉變為校園生活
（Ｂ）作者創作風格轉變是由於閱歷的增加
（Ｃ）一般校園生活的題材帶有批判的精神
（Ｄ）作者刻意追求寫實以表明態度和立場。
答案：（Ｂ）作者創作風格轉變是由於閱歷的增加
詳解：（Ａ）作者創作風格由校園生活轉變為寫實　（Ｂ）由「在我接觸了愈多，看了愈廣之後」可知　（Ｃ）由「帶著批判精神的寫實風格也是如此」可知，寫實的題材帶有批判精神　（Ｄ）由「這種轉變是自然而正確的」可知，作者並非刻意追求寫實

七年級/國語/康軒/第三課　吃冰的滋味 中等
「道地的麻婆豆腐，應該腴澤濃滋，麻、辣、燙、香、酥、鮮、嫩等七味俱全，然而一般館子做出來的，通常是一盤汪著紅油的豆腐羹，勉強有兩三味，但辣而無香、燙而不鮮，缺麻少酥更不在話下。嫩倒是嫩，因為用的是方便的盒裝豆腐，然而平板厚鈍如洋菜凍，既無豆香亦吸不進肉味，和油醬肉末貌合神離，即使以厚芡收攏兜搭，依然老死不相往來，滋味遂渙散失魂、元神出竅浮在表面。」關於這段文字的寫作手法，下列敘述何者最恰當？
（Ａ）以層遞手法指出麻婆豆腐的烹調祕訣
（Ｂ）以洋菜凍比喻道地麻婆豆腐彈性十足
（Ｃ）以擬人方式形容一般餐館麻婆豆腐不入味
（Ｄ）以誇張筆法描述道地麻婆豆腐的麻辣香燙。【110教育會考（補考）】
答案：（Ｃ）以擬人方式形容一般餐館麻婆豆腐不入味
詳解：（Ａ）文中未提及麻婆豆腐的烹調祕訣　（Ｂ）以洋菜凍比喻盒裝豆腐的平板厚鈍，既無豆香亦吸不進肉味　（Ｃ）由「貌合神離」、「老死不相往來」、「渙散失魂、元神出竅」可知　（Ｄ）文中未描述道地麻婆豆腐的麻辣香燙

古蒙仁在「從吃冰的滋味暢談『文字的視覺與味覺』」的演講中，認為就文字傳達情感而言，「視覺」是最直接的刺激，並將「視覺」分為三部分：色彩、形狀和動作。下列文句，何者不屬於這三部分？

（Ｂ）老闆從木箱中拿出一大塊晶亮的冰塊，軋入刨冰機中，然後飛快的搖轉起來時，那冰屑就像雪花一般，一片一片飛落盤中
（Ｃ）這些刨冰的添加物，像四果、粉圓、仙草、愛玉，或色彩鮮豔、或澄澈剔透、或方塊結晶，看起來都足以奪人眼目
（Ｄ）直到他們口袋裡的錢全被掏光為止，然後又搖著手上的鈴鐺，騎著腳踏車逐漸遠去。
答案：（Ａ）尤其是嗜冰如命的小孩子們，更是得其所哉。一個夏天下來，吃掉的冰恐怕都要多過自己的體重
詳解：（Ｂ）（Ｄ）動作　（Ｃ）色彩、形狀

  <!-- 2. 測驗進行區塊 -->
  <div class="card hidden" id="quizCard">
    <div class="card-title">✏️ 2. 請開始作答</div>
    <form id="quizForm"></form>
    <button class="btn" style="margin-top: 20px;" onclick="submitQuiz()">確認交卷</button>
  </div>

  <!-- 3. 結果與詳解區塊 -->
  <div class="card hidden" id="resultCard">
    <div class="score-banner">
      <div>測驗完成得分</div>
      <div class="score-num" id="scoreDisplay">0</div>
    </div>

    <div class="card-title">📊 題目結算與詳解</div>
    <div id="resultList"></div>

    <button class="btn btn-secondary" style="margin-top: 24px;" onclick="resetQuiz()">返回重新抽題</button>
  </div>
</div>

<script>
  let parsedBank = [];
  let currentQuestions = [];

  // 洗牌 (Fisher-Yates)
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 解析題庫
  function autoParseBank() {
    const rawText = document.getElementById('rawText').value.trim();
    if (!rawText) return;

    const blocks = rawText.split(/(?:\r?\n){2,}|---/);
    parsedBank = [];

    blocks.forEach(block => {
      const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length < 3) return;

      const header = lines[0];

      // 【修正 1】把 header 拆成 tokens，最後一個是難度
      const parts = header.split(/\s+/).filter(Boolean);
      let diff = '未指定';
      let lesson = header;

      if (parts.length >= 2) {
        const last = parts[parts.length - 1];
        if (['基礎', '中等', '進階', '易', '中', '難'].includes(last)) {
          diff = last === '易' ? '基礎' : last === '中' ? '中等' : last === '難' ? '進階' : last;
          lesson = parts.slice(0, -1).join(' ').trim();
        }
      }

      let questionText = '';
      let optionLines = [];
      let answerKey = '';
      let explanation = '無詳解說明。';

      const optPattern = /^[（(][ＡＢＣＤABCD][）)]/;

      lines.slice(1).forEach(line => {
        if (line.startsWith('答案：') || line.startsWith('答案:')) {
          answerKey = line.replace(/^答案[:：]/, '').trim();
        } else if (line.startsWith('詳解：') || line.startsWith('詳解:')) {
          explanation = line.replace(/^詳解[:：]/, '').trim();
        } else if (optPattern.test(line)) {
          optionLines.push(line);
        } else if (optionLines.length === 0) {
          questionText += (questionText ? '\n' : '') + line;
        }
      });

      const options = optionLines.map(line => {
        const label = line.match(optPattern)[0];
        const content = line.replace(optPattern, '').trim();
        return { originalLabel: label, content };
      });

      // 【修正 3a】從 answerKey 只抓「選項字母」
      const ansMatch = answerKey.match(/[（(]\s*([ＡＢＣＤABCD])\s*[）)]/);
      const answerLetter = ansMatch ? ansMatch[1].toUpperCase() : '';

      // 跳過「(有兩個答案)」或抓不到字母的題目，避免誤判
      if (!answerLetter || /有兩個答案/.test(questionText)) return;

      if (questionText && options.length > 0) {
        parsedBank.push({
          lesson,
          diff,
          question: questionText,
          options,
          answerLetter,
          explanation
        });
      }
    });

    updateDropdowns();
  }

  // 【修正 1 & 2】更新下拉選單：課次不含難度、難度動態產生
  function updateDropdowns() {
    const lessons = ['全部課次', ...new Set(parsedBank.map(q => q.lesson))];
    const diffs = ['全部難度', ...new Set(parsedBank.map(q => q.diff))];

    const lSelect = document.getElementById('lessonSelect');
    const dSelect = document.getElementById('diffSelect');

    lSelect.innerHTML = lessons
      .map(l => `<option value="${l}">${l}</option>`).join('');
    dSelect.innerHTML = diffs
      .map(d => `<option value="${d}">${d}</option>`).join('');
  }

  function toggleBankInput() {
    document.getElementById('bankArea').classList.toggle('hidden');
  }

  function startQuiz() {
    const selectedLesson = document.getElementById('lessonSelect').value;
    const selectedDiff = document.getElementById('diffSelect').value;
    const countInput = parseInt(document.getElementById('questionCount').value) || 5;

    let pool = parsedBank.filter(item => {
      const matchLesson = selectedLesson === '全部課次' || item.lesson === selectedLesson;
      const matchDiff = selectedDiff === '全部難度' || item.diff === selectedDiff;
      return matchLesson && matchDiff;
    });

    if (pool.length === 0) {
      alert('⚠️ 沒有符合所選條件的題目，請重新選擇課次或難度！');
      return;
    }

    pool = shuffle(pool);
    currentQuestions = pool.slice(0, Math.min(countInput, pool.length));

    const stdLabels = ['（Ａ）', '（Ｂ）', '（Ｃ）', '（Ｄ）'];

    currentQuestions = currentQuestions.map(q => {
      // 找出正確選項的「原始內容」
      const correctOpt = q.options.find(
        opt => opt.originalLabel.replace(/[（()）\s]/g, '').toUpperCase() === q.answerLetter
      );
      const correctContent = correctOpt ? correctOpt.content : '';

      // 打亂選項
      const shuffledOpts = shuffle(q.options);
      const randomizedOptions = shuffledOpts.map((opt, idx) => ({
        label: stdLabels[idx] || `（${idx + 1}）`,
        content: opt.content,
        isCorrect: opt.content === correctContent
      }));

      return { ...q, randomizedOptions };
    });

    renderQuizForm();
  }

  function renderQuizForm() {
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('resultCard').classList.add('hidden');
    document.getElementById('quizCard').classList.remove('hidden');

    const form = document.getElementById('quizForm');
    form.innerHTML = '';

    currentQuestions.forEach((q, qIdx) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'q-card';

      const optionsHtml = q.randomizedOptions.map((opt, oIdx) => `
        <label class="option-item">
          <input type="radio" name="q_${qIdx}" value="${oIdx}">
          <span class="option-text"><strong>${opt.label}</strong> ${opt.content}</span>
        </label>
      `).join('');

      // 【修正 2】作答頁不顯示難度
      qDiv.innerHTML = `
        <div class="q-tags">
          <span class="badge">${q.lesson}</span>
        </div>
        <div class="q-title">${qIdx + 1}. ${q.question}</div>
        <div class="option-list">${optionsHtml}</div>
      `;
      form.appendChild(qDiv);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 【修正 3b】對答案 + 計分
  function submitQuiz() {
    let score = 0;
    const resultList = document.getElementById('resultList');
    resultList.innerHTML = '';

    currentQuestions.forEach((q, qIdx) => {
      const selected = document.querySelector(`input[name="q_${qIdx}"]:checked`);
      const userChoiceIndex = selected ? parseInt(selected.value) : -1;

      const correctOpt = q.randomizedOptions.find(o => o.isCorrect);
      const userOpt = userChoiceIndex !== -1 ? q.randomizedOptions[userChoiceIndex] : null;

      const isCorrect = !!(userOpt && userOpt.isCorrect);
      if (isCorrect) score++;

      const resDiv = document.createElement('div');
      resDiv.className = 'q-card';

      const statusClass = isCorrect ? 'explain-correct' : 'explain-wrong';
      const userText = userOpt ? `${userOpt.label} ${userOpt.content}` : '未作答';
      const correctText = correctOpt
        ? `${correctOpt.label} ${correctOpt.content}`
        : '（題庫答案對應失敗）';

      // 【修正 2】結果頁也不顯示難度
      resDiv.innerHTML = `
        <div class="q-tags">
          <span class="badge">${q.lesson}</span>
        </div>
        <div class="q-title">${qIdx + 1}. ${q.question}</div>

        <div class="explain-box ${statusClass}">
          <div><strong>你的作答：</strong>${userText} ${isCorrect ? '✅ (正確)' : '❌ (錯誤)'}</div>
          ${!isCorrect ? `<div><strong>答案：</strong>${correctText}</div>` : ''}
          <div style="margin-top: 6px; font-weight: 600;">【詳解】</div>
          <div>${q.explanation}</div>
        </div>
      `;
      resultList.appendChild(resDiv);
    });

    const total = currentQuestions.length;
    const finalScore = total ? Math.round((score / total) * 100) : 0;
    document.getElementById('scoreDisplay').innerText = `${finalScore} 分 (${score}/${total}題)`;

    document.getElementById('quizCard').classList.add('hidden');
    document.getElementById('resultCard').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetQuiz() {
    document.getElementById('resultCard').classList.add('hidden');
    document.getElementById('setupCard').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = function () {
    autoParseBank();
  };
</script>
